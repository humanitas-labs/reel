<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tape strip treemap</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root {
        --bg: #0c0d0d;
        --panel: #131314;
        --raise: #1d1e20;
        --line: #191919;
        --white: #ffffff;
        --muted: #959eac;
        --dim: #5c6066;
        --nav: #b9bec7;
        --del: #cb7676;
        --sf: -apple-system, "SF Pro", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
        --inter: Inter, -apple-system, "Helvetica Neue", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--white);
        font: 12.5px/1.35 var(--inter);
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        padding: 16px 24px 24px;
        gap: 12px;
        -webkit-font-smoothing: antialiased;
      }
      .sw {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: 0;
      }
      .sw.hatch {
        background-image: repeating-linear-gradient(135deg, var(--del) 0 1.5px, transparent 1.5px 4px);
        background-color: rgba(203, 118, 118, 0.25);
      }
      .right {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--panel);
        border-radius: 999px;
      }
      .seg button {
        background: transparent;
        border: 0;
        color: var(--muted);
        font: 400 12.5px var(--inter);
        padding: 5px 16px;
        border-radius: 99px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--raise);
        color: var(--white);
        font-weight: 500;
      }
      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--sf);
      }
      .title b {
        font-weight: 590;
        font-size: 30px;
        color: var(--white);
      }
      .title span {
        font-weight: 400;
        font-size: 20px;
        color: var(--muted);
      }
      .title .arrow {
        color: var(--dim);
        font-size: 20px;
        margin: 0 2px;
      }
      .title .sha {
        font-family: var(--inter);
        font-size: 12px;
        color: var(--dim);
        margin-left: 6px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .nav b {
        color: var(--white);
        font-weight: 500;
        font-family: var(--inter);
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 24px;
        min-height: 0;
      }
      #stage {
        position: relative;
        min-height: 0;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        font-variant-numeric: tabular-nums;
      }
      .sec {
        padding: 8px 0 14px;
      }
      .sec + .sec {
        border-top: 1px solid var(--line);
      }
      .lab {
        font-size: 12px;
        color: var(--muted);
        padding-bottom: 6px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 4px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .row b {
        font-weight: 500;
        font-size: 13px;
        color: var(--white);
      }
      .row b.del {
        color: var(--del);
      }
      .row .cnt {
        color: var(--dim);
        font-size: 12px;
        margin-left: 6px;
        font-weight: 400;
      }
      .strip {
        display: flex;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        margin: 6px 0 2px;
      }
      .strip i {
        display: block;
        height: 100%;
      }
      .strip .d {
        background-image: repeating-linear-gradient(135deg, var(--del) 0 1.5px, transparent 1.5px 4px);
        background-color: rgba(203, 118, 118, 0.3);
      }
      .strip .k {
        background: var(--raise);
      }
      #sel .name {
        font-size: 13px;
        font-weight: 500;
        color: var(--white);
        word-break: break-all;
        padding-bottom: 2px;
      }
      #sel .state {
        font-size: 11px;
        color: var(--muted);
        padding-bottom: 6px;
      }
      #sel .state.del {
        color: var(--del);
      }
      #sel .hint {
        color: var(--dim);
        font-size: 12px;
      }
      text {
        pointer-events: none;
      }
      .g-title {
        fill: var(--white);
        font: 500 12.5px var(--sf);
      }
      .g-total {
        fill: var(--muted);
        font: 400 11px var(--inter);
      }
      .t-name {
        fill: var(--white);
        font: 500 11.4px var(--inter);
      }
      .t-val {
        fill: var(--muted);
        font: 400 10.5px var(--inter);
      }
      .cut .t-name {
        fill: #ffffff;
      }
      .cut .t-val {
        fill: #cdb9b9;
      }
      .plate {
        fill: #0c0d0d;
        opacity: 0.78;
      }
      .tile rect {
        stroke: var(--bg);
        stroke-width: 2;
      }
      .tile:hover rect {
        filter: brightness(1.35);
      }
      .grp > rect {
        stroke: var(--bg);
        stroke-width: 3;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="title">
        <b>cap</b><span>0.6.0</span><span class="arrow">›</span><b>tape</b><span class="sha">40f44a803</span>
      </div>
      <div class="right">
        <div class="nav" id="nav"></div>
        <div class="seg" id="metrics">
          <button data-m="1" aria-pressed="true">Lines</button>
          <button data-m="2" aria-pressed="false">Files</button>
          <button data-m="3" aria-pressed="false">Bytes</button>
        </div>
      </div>
    </div>
    <main>
      <div id="stage"><svg id="svg"></svg></div>
      <aside>
        <div class="sec" id="totals"></div>
        <div class="sec" id="groups"></div>
        <div class="sec" id="sel">
          <div class="lab">Selection</div>
          <div class="hint">Hover a tile</div>
        </div>
      </aside>
    </main>
    <script>
      // path, source lines, tracked files, tracked bytes at upstream commit 40f44a803, then the same three at Tape HEAD, then group.
      // Rows with a Tape value below the upstream value were trimmed in place; the hatched slice on a tile is the removed share.
      const DATA = [
        ["apps/web", 290969, 1826, 51860238, 0, 0, 0, "web"],
        ["apps/desktop", 186836, 632, 55729212, 157061, 535, 53565294, "app"],
        ["apps/desktop-gpui", 170930, 307, 9484970, 0, 0, 0, "gpui"],
        ["packages/database", 166924, 150, 3847061, 0, 0, 0, "web"],
        ["crates/recording", 96968, 98, 3475149, 84934, 86, 3061896, "capture"],
        ["vendor", 82460, 204, 3128639, 82460, 204, 3128639, "tooling"],
        ["crates/rendering", 44923, 81, 1709115, 44925, 81, 1709087, "editor"],
        ["apps/mobile", 33847, 125, 1141967, 0, 0, 0, "other"],
        ["apps/media-server", 25494, 68, 763335, 0, 0, 0, "web"],
        ["crates/editor", 25144, 31, 953377, 25110, 31, 952320, "editor"],
        ["apps/cli", 23713, 51, 5978463, 8773, 19, 304562, "app"],
        ["apps/chrome-extension", 21590, 110, 3671334, 0, 0, 0, "other"],
        ["scripts", 21236, 89, 705757, 1983, 8, 60496, "tooling"],
        ["crates/enc-ffmpeg", 13402, 31, 452623, 13401, 31, 452558, "capture"],
        ["packages/web-backend", 10572, 50, 304038, 0, 0, 0, "web"],
        ["crates/project", 9741, 9, 329530, 9670, 9, 327506, "editor"],
        ["crates/cap-test", 8648, 36, 276988, 8442, 36, 270355, "editor"],
        ["crates/audio", 7719, 21, 274295, 7718, 21, 274230, "capture"],
        ["crates/rnnoise", 7586, 41, 3806968, 7585, 41, 3806903, "capture"],
        ["crates/export", 7287, 17, 261981, 7286, 17, 261922, "editor"],
        [".agents", 5920, 15, 212345, 0, 0, 0, "ops"],
        ["packages/recorder-core", 4924, 20, 139095, 0, 0, 0, "web"],
        ["packages/web-domain", 4617, 29, 128800, 0, 0, 0, "web"],
        ["crates/enc-avfoundation", 4511, 3, 161840, 4188, 3, 150847, "capture"],
        [".github", 4098, 25, 392237, 0, 0, 0, "ops"],
        ["crates/utils", 3938, 12, 131258, 3725, 11, 123918, "editor"],
        ["crates/scap-targets", 3862, 10, 119909, 3861, 10, 119844, "capture"],
        ["crates/camera-effects", 3111, 14, 26469045, 3110, 14, 26468980, "capture"],
        ["crates/video-decode", 2930, 9, 128561, 2929, 9, 128496, "capture"],
        ["crates/frame-converter", 2719, 9, 87758, 2718, 9, 87693, "capture"],
        ["packages/ui", 2584, 32, 74508, 0, 0, 0, "web"],
        ["crates/cursor-info", 2449, 61, 170100, 2448, 61, 170035, "capture"],
        ["crates/enc-mediafoundation", 2153, 10, 75706, 2152, 10, 75641, "capture"],
        ["emails", 2033, 38, 282415, 0, 0, 0, "web"],
        ["crates/automation", 1769, 4, 54084, 1468, 4, 44322, "editor"],
        ["crates/camera", 1643, 8, 50695, 1642, 8, 50630, "capture"],
        ["crates/rendering-skia", 1485, 8, 46313, 1484, 8, 46248, "editor"],
        ["crates/camera-directshow", 1460, 4, 42990, 1459, 4, 42925, "capture"],
        ["crates/gpu-converters", 1433, 18, 59393, 1432, 18, 59328, "capture"],
        ["crates/timestamp", 1408, 5, 47982, 1407, 5, 47917, "capture"],
        ["crates/camera-ffmpeg", 1370, 7, 48188, 1369, 7, 48123, "capture"],
        ["crates/camera-windows", 1152, 5, 36698, 1151, 5, 36633, "capture"],
        ["crates/cli-install", 1140, 3, 39607, 0, 0, 0, "ops"],
        ["crates/scap-direct3d", 1112, 4, 32788, 1111, 4, 32723, "capture"],
        ["packages/ui-solid", 1106, 103, 109777, 1115, 102, 105564, "app"],
        ["crates/cap-muxer", 1044, 2, 34050, 1044, 2, 34050, "capture"],
        ["crates/camera-mediafoundation", 901, 4, 29007, 900, 4, 28942, "capture"],
        ["apps/src", 871, 1, 55535, 0, 0, 0, "other"],
        ["crates/cap-muxer-protocol", 760, 2, 26892, 760, 2, 26892, "capture"],
        ["root files", 741, 20, 1513911, 450, 20, 603301, "tooling"],
        ["packages/sdk-recorder", 728, 10, 16823, 0, 0, 0, "web"],
        ["packages/utils", 693, 11, 17219, 0, 0, 0, "web"],
        ["crates/media-info", 643, 3, 23404, 642, 3, 23339, "editor"],
        ["crates/camera-avfoundation", 597, 4, 19672, 596, 4, 19607, "capture"],
        ["crates/mediafoundation-ffmpeg", 548, 6, 16228, 547, 6, 16163, "capture"],
        ["crates/scap-screencapturekit", 530, 7, 15551, 529, 7, 15486, "capture"],
        ["packages/web-api-contract", 503, 5, 11800, 0, 0, 0, "web"],
        ["apps/discord-bot", 481, 10, 16754, 0, 0, 0, "other"],
        ["crates/scap-ffmpeg", 448, 6, 13504, 447, 6, 13439, "capture"],
        ["crates/cursor-capture", 433, 4, 13100, 432, 4, 13035, "capture"],
        ["root files (removed)", 416, 5, 16546, 0, 0, 0, "ops"],
        ["packages/env", 292, 6, 9164, 0, 0, 0, "web"],
        ["packages/web-api-contract-effect", 274, 2, 7092, 0, 0, 0, "web"],
        ["infra", 272, 2, 6901, 0, 0, 0, "web"],
        ["crates/enc-gif", 229, 2, 6609, 228, 2, 6544, "capture"],
        ["crates/workspace-hack", 203, 4, 20279, 0, 0, 0, "ops"],
        ["packages/sdk-embed", 186, 9, 4198, 0, 0, 0, "web"],
        ["crates/scap-cpal", 183, 2, 5485, 182, 2, 5420, "capture"],
        ["docs", 176, 2, 21106, 0, 0, 0, "ops"],
        ["crates/ffmpeg-hw-device", 172, 2, 4844, 171, 2, 4779, "capture"],
        ["crates/d3d-adapter", 171, 2, 6153, 170, 2, 6088, "capture"],
        ["packages/config", 145, 6, 3257, 0, 0, 0, "web"],
        ["crates/mediafoundation-utils", 127, 2, 3149, 126, 2, 3084, "capture"],
        [".claude", 117, 1, 6146, 0, 0, 0, "ops"],
        ["crates/fail", 109, 2, 2600, 108, 2, 2535, "editor"],
        [".config", 98, 1, 3531, 0, 0, 0, "ops"],
        ["packages/local-docker", 81, 2, 2144, 0, 0, 0, "web"],
        ["crates/media", 68, 2, 1755, 67, 2, 1690, "capture"],
        ["packages/tsconfig", 61, 4, 1344, 61, 4, 1344, "app"],
        ["crates/cpal-ffmpeg", 57, 2, 1845, 56, 2, 1780, "capture"],
        ["packaging", 54, 5, 4992, 54, 5, 4992, "tooling"],
        ["packages/s3", 22, 1, 738, 0, 0, 0, "web"],
        ["crates/flags", 21, 2, 431, 20, 2, 366, "editor"],
        ["crates/api", 15, 2, 368, 0, 0, 0, "ops"],
        ["patches", 0, 1, 95915, 0, 1, 95915, "tooling"],
        [".plan", 0, 0, 0, 158, 1, 25435, "tooling"],
      ]

      const GROUPS = {
        app: { label: "Desktop app & CLI", keep: true, fill: "#26272a" },
        capture: { label: "Capture & media crates", keep: true, fill: "#2e2f33" },
        editor: { label: "Editor, render & export crates", keep: true, fill: "#232427" },
        tooling: { label: "Vendor & tooling", keep: true, fill: "#1f2022" },
        web: { label: "Web app & cloud", keep: false },
        gpui: { label: "Native rewrite (gpui)", keep: false },
        other: { label: "Mobile, extension & bots", keep: false },
        ops: { label: "CI, agents & ops", keep: false },
      }
      const ORDER = ["app", "capture", "editor", "tooling", "web", "gpui", "other", "ops"]
      const UNITS = { 1: "lines", 2: "files", 3: "bytes" }
      const fmt = (n) => n.toLocaleString("en-US")
      const fmtB = (n) =>
        n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B"
      const val = (n, m) => (m === 3 ? fmtB(n) : fmt(n))
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
      let metric = 1

      function squarify(items, x, y, w, h) {
        const out = []
        let rest = items.filter((d) => d.v > 0)
        let rx = x,
          ry = y,
          rw = w,
          rh = h
        while (rest.length && rw > 0 && rh > 0) {
          const scale = (rw * rh) / rest.reduce((s, d) => s + d.v, 0)
          const side = Math.min(rw, rh)
          const worst = (r) => {
            const s = r.reduce((a, d) => a + d.v * scale, 0)
            const mx = Math.max(...r.map((d) => d.v * scale)),
              mn = Math.min(...r.map((d) => d.v * scale))
            return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn))
          }
          let row = [rest[0]],
            i = 1
          while (i < rest.length && worst(row.concat(rest[i])) <= worst(row)) row.push(rest[i++])
          const rs = row.reduce((a, d) => a + d.v * scale, 0)
          if (rw >= rh) {
            const cw = rs / rh
            let cy = ry
            for (const d of row) {
              const ch = (d.v * scale) / cw
              out.push({ ...d, x: rx, y: cy, w: cw, h: ch })
              cy += ch
            }
            rx += cw
            rw -= cw
          } else {
            const chh = rs / rw
            let cx = rx
            for (const d of row) {
              const cw = (d.v * scale) / chh
              out.push({ ...d, x: cx, y: ry, w: cw, h: chh })
              cx += cw
            }
            ry += chh
            rh -= chh
          }
          rest = rest.slice(i)
        }
        return out
      }

      const items = () =>
        DATA.map((d) => ({
          full: d[0],
          name: d[0].replace(/^(packages|crates|apps)\//, ""),
          lines: d[1],
          files: d[2],
          bytes: d[3],
          after: { 1: d[4], 2: d[5], 3: d[6] },
          g: d[7],
          v: d[metric],
          hv: d[metric + 3],
        }))
      const sw = (g) =>
        GROUPS[g].keep ? `<i class="sw" style="background:${GROUPS[g].fill}"></i>` : `<i class="sw hatch"></i>`

      function tileText(t, cut) {
        const x = t.x + 7
        const stats = [`${fmt(t.lines)} lines`, `${fmt(t.files)} files`, fmtB(t.bytes)]
        const lines = []
        if (t.w > 60 && t.h > 24) lines.push(["t-name", esc(t.name)])
        else return ""
        if (t.w > 110 && t.h > 72) stats.forEach((s) => lines.push(["t-val", s]))
        else if (t.w > 200 && t.h > 40) lines.push(["t-val", stats.join(" · ")])
        else if (t.w > 70 && t.h > 40)
          lines.push(["t-val", `${val(t.v, metric)}${metric === 3 ? "" : " " + UNITS[metric]}`])
        const text = lines
          .map(([c, s], i) => `<text class="${c}" x="${x}" y="${t.y + 16 + (i ? 2 : 0) + i * 14}">${s}</text>`)
          .join("")
        if (!cut) return text
        const w = Math.min(t.w - 6, 12 + Math.max(...lines.map(([, s]) => s.length)) * 6.4)
        const h = 8 + lines.length * 14 + (lines.length > 1 ? 2 : 0)
        return `<rect class="plate" x="${t.x + 3}" y="${t.y + 3}" width="${w}" height="${h}" rx="3"/>` + text
      }

      function render() {
        const svg = document.getElementById("svg")
        const box = svg.getBoundingClientRect()
        const W = Math.max(320, box.width),
          H = Math.max(320, box.height)
        const all = items()
        const total = all.reduce((s, d) => s + d.v, 0)
        const after = all.reduce((s, d) => s + d.hv, 0)
        const groups = ORDER.map((g) => ({
          g,
          v: all.filter((d) => d.g === g).reduce((s, d) => s + d.v, 0),
          kids: all.filter((d) => d.g === g).sort((a, b) => b.v - a.v),
        }))
          .filter((x) => x.v > 0)
          .sort((a, b) => b.v - a.v)
        const laid = squarify(groups, 0, 0, W, H)
        let html = `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#cb7676" opacity="0.16"/><rect width="1.6" height="7" fill="#cb7676" opacity="0.8"/></pattern></defs>`
        const HEAD = 24,
          PAD = 3
        for (const G of laid) {
          const meta = GROUPS[G.g]
          const fill = meta.keep ? meta.fill : "url(#hatch)"
          html += `<g class="grp"><rect x="${G.x}" y="${G.y}" width="${G.w}" height="${G.h}" fill="${meta.keep ? "#131314" : "#1a1213"}"/>`
          if (G.w > 90) html += `<text class="g-title" x="${G.x + 8}" y="${G.y + 16}">${esc(meta.label)}</text>`
          if (G.w > 220)
            html += `<text class="g-total" x="${G.x + G.w - 8}" y="${G.y + 16}" text-anchor="end">${val(G.v, metric)} · ${Math.round((G.v / total) * 100)}%</text>`
          const inner = squarify(
            G.kids,
            G.x + PAD,
            G.y + HEAD + PAD,
            Math.max(0, G.w - PAD * 2),
            Math.max(0, G.h - HEAD - PAD * 2),
          )
          for (const t of inner) {
            const idx = all.findIndex((d) => d.full === t.full)
            let slice = ""
            if (meta.keep && t.hv < t.v) {
              const cut = t.h * (1 - t.hv / t.v)
              slice = `<rect x="${t.x}" y="${t.y + t.h - cut}" width="${t.w}" height="${cut}" fill="url(#hatch)"/>`
            }
            html += `<g class="tile ${meta.keep ? "" : "cut"}" data-i="${idx}"><rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" fill="${fill}"/>${slice}${tileText(t, !meta.keep)}</g>`
          }
          html += "</g>"
        }
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`)
        svg.innerHTML = html

        const unit = UNITS[metric]
        const pct = Math.round((1 - after / total) * 100)
        const byGroup = {}
        for (const d of all) byGroup[d.g] = (byGroup[d.g] || 0) + d.v
        const nGroup = {}
        for (const d of all) nGroup[d.g] = (nGroup[d.g] || 0) + 1
        const live = ORDER.filter((g) => byGroup[g])

        document.getElementById("nav").innerHTML =
          `<span>Before <b>${val(total, metric)}</b></span><span>After <b>${val(after, metric)}</b></span><span>Removed <b style="color:var(--del)">−${pct}%</b></span>`

        document.getElementById("totals").innerHTML = `<div class="lab">${unit[0].toUpperCase() + unit.slice(1)}</div>
    <div class="row"><span>Removed</span><b class="del">${val(total - after, metric)}</b></div>
    <div class="strip"><i class="d" style="width:${pct}%"></i><i class="k" style="width:${100 - pct}%"></i></div>
    <div class="row"><span>Kept</span><b>${val(after, metric)}</b></div>
    <div class="row"><span>Packages & crates</span><b>72<span class="cnt">→ 48</span></b></div>
    <div class="row"><span>Locked JS packages</span><b>4,229<span class="cnt">→ 1,045</span></b></div>
    <div class="row"><span>Locked Rust crates</span><b>1,248<span class="cnt">→ 1,130</span></b></div>`
        document.getElementById("groups").innerHTML =
          `<div class="lab">Groups</div>` +
          live
            .map(
              (g) =>
                `<div class="row"><span>${sw(g)}${GROUPS[g].label}<span class="cnt">${nGroup[g]}</span></span><b class="${GROUPS[g].keep ? "" : "del"}">${val(byGroup[g], metric)}</b></div>`,
            )
            .join("")

        const sel = document.getElementById("sel")
        svg.querySelectorAll(".tile").forEach((el) => {
          const d = all[+el.dataset.i]
          const G = GROUPS[d.g]
          const state = !G.keep ? "Deleted" : d.after[1] < d.lines || d.after[2] < d.files ? "Trimmed" : "Kept"
          el.addEventListener("mouseenter", () => {
            sel.innerHTML = `<div class="lab">Selection</div><div class="name">${esc(d.full)}</div><div class="state ${G.keep ? "" : "del"}">${state} · ${G.label}</div>
        <div class="row"><span>Source lines</span><b>${fmt(d.lines)}<span class="cnt">→ ${fmt(d.after[1])}</span></b></div><div class="row"><span>Tracked files</span><b>${fmt(d.files)}<span class="cnt">→ ${fmt(d.after[2])}</span></b></div><div class="row"><span>Tracked bytes</span><b>${fmtB(d.bytes)}<span class="cnt">→ ${fmtB(d.after[3])}</span></b></div>`
          })
        })
      }
      document.getElementById("metrics").addEventListener("click", (e) => {
        const b = e.target.closest("button")
        if (!b) return
        metric = +b.dataset.m
        ;[...e.currentTarget.children].forEach((x) => x.setAttribute("aria-pressed", x === b))
        render()
      })
      window.addEventListener("resize", render)
      if (location.search.includes("export")) document.getElementById("sel").style.display = "none"
      render()
    </script>
  </body>
</html>
